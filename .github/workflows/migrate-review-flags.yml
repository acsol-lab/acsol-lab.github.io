name: One-time normalize Under Review flags
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set legacy review flags without deleting old fields
        run: python tools/migrate_review_flags.py
      - name: Commit normalized publication JSON (if changed)
        run: |
          if [[ -n "$(git status --porcelain -- data/publications.json data/publications-import.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json data/publications-import.json
            git commit -m "Normalize Under Review checkbox for existing publications"
            git push
          else
            echo "No changes needed"
          fi
