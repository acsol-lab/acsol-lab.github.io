name: One-time ACSoL banner image sizing

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'plan = preview only, apply = update current CMS and banner code'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preview or apply banner sizing options
        run: python3 tools/patch_banner_sizing.py --mode "${{ inputs.run_mode }}" --root .
      - name: Check JavaScript syntax
        if: inputs.run_mode == 'apply'
        run: node --check site.js
      - name: Commit updated files
        if: inputs.run_mode == 'apply'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml site.js index.html banner-image-sizing.css
          if ! git diff --staged --quiet; then
            git commit -m "Add CMS banner width and height controls"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
