name: Sync student team options from Research
on:
  push:
    branches: [main]
    paths:
      - 'data/research.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: python tools/sync_research_teams.py
      - name: Commit changes if needed
        run: |
          if ! git diff --quiet -- .pages.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .pages.yml
            git commit -m 'Sync Research teams in CMS dropdown'
            git push
          fi
