media:
  input: media
  output: /media
  rename: safe
  categories:
  - image
content:
- name: news
  label: News / 공지사항
  type: file
  path: data/news.json
  format: json
  list: true
  fields:
  - name: date
    label: 날짜
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: category
    label: 구분 (Award, Publication 등)
    type: string
    required: true
  - name: title
    label: 제목
    type: string
    required: true
  - name: description
    label: 내용 요약
    type: text
- name: publications
  label: Publications / 논문
  type: file
  path: data/publications.json
  format: json
  list: true
  fields:
  - name: year
    label: 출판 연도
    type: number
    required: true
  - name: journal
    label: 학술지
    type: string
    required: true
  - name: title
    label: 논문 제목
    type: string
    required: true
  - name: authors
    label: 저자 또는 소개
    type: text
  - name: doi
    label: DOI (https://doi.org/ 제외)
    type: string
- name: gallery
  label: Gallery / 사진
  type: file
  path: data/gallery.json
  format: json
  list: true
  fields:
  - name: title
    label: 사진 제목
    type: string
    required: true
  - name: date
    label: 날짜 또는 연도
    type: string
  - name: image
    label: 사진 업로드 또는 선택
    type: image
    required: true
  - name: description
    label: 이미지 설명
    type: text
