- name: publications
  label: Publications / 출판 날짜 · 논문
  type: file
  path: data/publications.json
  format: json
  list: true
  fields:
  - name: publishedDate
    label: 정확한 출판일 (YYYY-MM-DD, 날짜 기준 자동 정렬)
    type: date
    default: ''
    options:
      format: yyyy-MM-dd
  - name: year
    label: 기존 연도 (날짜를 모르는 기존 논문용, 날짜 입력 시 자동 무시)
    type: number
  - name: journal
    label: 학술지
    type: string
    required: true
  - name: title
    label: 논문 제목
    type: string
    required: true
  - name: authors
    label: 저자 또는 소개
    type: text
  - name: doi
    label: DOI (https://doi.org/ 제외)
    type: string
  - name: status
    label: 상태 (Published / Accepted / Under Review / Under Revision)
    type: select
    options:
      values:
      - name: Published
        label: Published / 출판됨
      - name: Accepted
        label: Accepted / 게재 승인
      - name: Under Review
        label: Under Review / 심사 중
      - name: Under Revision
        label: Under Revision / 수정 심사 중
  - name: publicationType
    label: 항목 종류
    type: select
    options:
      values:
      - name: journal
        label: Journal / 학술지
      - name: book
        label: Book Chapter / 도서 챕터
  - name: typography
    label: 이 항목만의 글꼴 · 글자 크기 (선택)
    type: object
    fields: *id002
