  - name: professorBio
    label: 교수님 소개 문구
    type: text
  - name: labPhone
    label: 연구실 전화번호 (Contact에도 반영)
    type: string
  - name: address
    label: 연구실 주소 (Contact에도 반영)
    type: text
- name: professor_employment
