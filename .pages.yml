# ACSoL v13 — compact Publications filters / accessible CMS typography labels.
media:
  input: media
  output: /media
  rename: safe
  categories:
  - image
content:
- name: edit_content
  label: 01 · 콘텐츠 관리
  type: group
  items:
  - name: cms_home
    label: Home · 홈
    type: group
    items:
    - name: home
      label: 메인 화면 설정
      type: file
      path: data/home.json
      format: json
      fields:
      - name: heroTitle
        label: 메인 큰 문구 (앞부분)
        type: string
      - name: heroAccent
        label: 메인 큰 문구 (블루 컬러·세리프체 강조)
        type: string
      - name: heroKorean
        label: 메인 한국어 연구실명
        type: string
      - name: heroDescription
        label: 메인 영문 소개
        type: text
      - name: labIntro
        label: 메인 연구 분야 요약 설명
        type: text
      - name: slideIntervalSeconds
        label: 메인 사진 자동 전환 간격 (초, 2~60초)
        type: number
      - name: eyebrow
        label: 메인 상단 작은 문구
        type: string
      - name: actionLabel
        label: Explore our research 버튼 문구
        type: string
      - name: summaryLabel
        label: 연구실 소개 라벨
        type: string
      - name: headingFont
        label: 이 페이지 큰 제목 글꼴
        type: select
        options: &id001
          values:
          - name: inherit
            label: 기본 / 공통 설정 상속
          - name: pretendard
            label: Pretendard
          - name: noto
            label: Noto Sans KR
          - name: nanum
            label: Nanum Gothic
          - name: serif
            label: Noto Serif KR
          - name: system
            label: 기본 시스템 글꼴
      - name: headingSize
        label: 이 페이지 큰 제목 글자 크기(px, 0=기본 / 권장 36~92)
        type: number
      - name: bodyFont
        label: 이 페이지 일반 텍스트 글꼴
        type: select
        options: *id001
      - name: bodySize
        label: 이 페이지 본문 크기(px, 0=기본 / 권장 14~20)
        type: number
      - name: labelSize
        label: 이 페이지 작은 라벨·캡션 크기(px, 0=기본)
        type: number
      - name: sectionHeadingSize
        label: 이 페이지 섹션 제목 크기(px, 0=기본)
        type: number
    - name: banners
      label: 기간 지정 모집 · 안내 배너
      type: file
      path: data/banners.json
      format: json
      list: true
      fields:
      - name: id
        label: '배너 고유 ID (예: recruit-2027, 중복되지 않게 입력)'
        type: string
        required: true
      - name: enabled
        label: 사용 여부
        type: boolean
        default: true
      - name: title
        label: 배너 제목 (대체 설명 포함)
        type: string
      - name: image
        label: 배너 사진 · JPG/PNG/WebP
        type: image
        required: true
      - name: alt
        label: 사진 대체 설명
        type: string
      - name: startDate
        label: 노출 시작 날짜 (한국시간, 해당 날짜부터)
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: endDate
        label: 노출 마지막 날짜 (한국시간, 해당 날짜까지)
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: linkUrl
        label: 배너 클릭 시 이동할 주소 (선택, https://로 시작)
        type: string
  - name: cms_research
    label: Research · 연구
    type: group
    items:
    - name: research
      label: 연구 분야 · 펼침 상세 내용
      type: file
      path: data/research.json
      format: json
      list: true
      fields:
      - name: title
        label: 연구 분야 제목
        type: string
        required: true
      - name: subtitle
        label: 영문 소제목
        type: string
      - name: description
        label: 연구 분야 상세 설명
        type: text
      - name: keywords
        label: 관련 키워드
        type: text
      - name: image
        label: 연구 분야 사진 업로드
        type: image
      - name: imageAlt
        label: 사진 설명 (접근성)
        type: string
      - name: detailIntro
        label: 펼쳤을 때 나오는 상세 도입 설명
        type: text
      - name: detailSections
        label: 추가 상세 내용 (글·사진 여러 개)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{heading} (블록 {index})'
        fields:
        - name: heading
          label: 상세 항목 제목 (선택)
          type: string
        - name: body
          label: 상세 글 (줄바꿈 가능)
          type: text
        - name: image
          label: 상세 이미지 (선택)
          type: image
        - name: imageAlt
          label: 이미지 대체 설명 (선택)
          type: string
        - name: imageCaption
          label: 이미지 아래 캡션 (선택)
          type: string
        - name: typography
          label: 상세 단락 디자인 (제목과 설명문을 따로 설정)
          type: object
          fields: &id002
          - name: bodyFont
            label: 설명·본문 글꼴 — 논문에서는 저자명, 연구에서는 설명글
            type: select
            options:
              values:
              - name: inherit
                label: 페이지 기본
              - name: pretendard
                label: Pretendard
              - name: noto
                label: Noto Sans KR
              - name: nanum
                label: Nanum Gothic
              - name: serif
                label: Noto Serif KR
          - name: bodySize
            label: 설명·본문 글자 크기(px · 0은 기본값)
            type: number
          - name: titleFont
            label: 제목 글꼴 — 논문 제목, 연구 주제명, 소식 제목 등
            type: select
            options:
              values:
              - name: inherit
                label: 페이지 기본
              - name: pretendard
                label: Pretendard
              - name: noto
                label: Noto Sans KR
              - name: nanum
                label: Nanum Gothic
              - name: serif
                label: Noto Serif KR
          - name: titleSize
            label: 제목 글자 크기(px · 0은 기본값)
            type: number
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
  - name: cms_people
    label: People · 구성원
    type: group
    items:
    - name: professor
      label: 교수님 프로필
      type: file
      path: data/professor.json
      format: json
      fields:
      - name: professorTagline
        label: 프로필 상단 문구 (Captain of ACSoL...)
        type: string
      - name: professorName
        label: 영문 이름
        type: string
      - name: professorKoreanName
        label: 한글 이름
        type: string
      - name: professorKoreanSuffix
        label: 한글 호칭 (교수 등)
        type: string
      - name: professorPhoto
        label: 교수님 사진
        type: image
      - name: professorTitle
        label: 직책 / 소개 첫 번째 줄
        type: text
      - name: professorDepartment
        label: 소속 학과 (두 번째 줄)
        type: text
      - name: professorAdditionalTitle
        label: 추가 직책 (세 번째 줄)
        type: text
      - name: professorUniversity
        label: 소속 대학교 (네 번째 줄)
        type: string
      - name: office
        label: 교수실 위치
        type: string
      - name: professorOfficeLabel
        label: 교수실 표시 문구 (Office)
        type: string
      - name: professorEmail
        label: 이메일 주소
        type: string
      - name: professorEmailLabel
        label: 이메일 표시 문구 (Email)
        type: string
      - name: contactPhone
        label: 교수실 전화번호
        type: string
      - name: professorPhoneLabel
        label: 전화 표시 문구 (Tel)
        type: string
      - name: professorBio
        label: 교수님 소개 문구
        type: text
      - name: labPhone
        label: 연구실 전화번호 (Contact에도 반영)
        type: string
      - name: address
        label: 연구실 주소 (Contact에도 반영)
        type: text
    - name: professor_employment
      label: 교수님 경력 및 직책
      type: file
      path: data/professor-employment.json
      format: json
      list: true
      fields:
      - name: period
        label: '재직 기간 (예: 2026 – Present)'
        type: string
        required: true
      - name: position
        label: 직책 / 경력 내용
        type: text
        required: true
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
    - name: professor_awards
      label: 교수님 수상 경력
      type: file
      path: data/professor-awards.json
      format: json
      list: true
      fields:
      - name: date
        label: '수상 시기 (예: 11/2025)'
        type: string
        required: true
      - name: award
        label: 수상명
        type: text
        required: true
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
    - name: students
      label: 박사·석사 재학생
      type: file
      path: data/students.json
      format: json
      list: true
      fields:
      - name: role
        label: 과정 선택
        type: select
        required: true
        options:
          values:
          - name: phd
            label: 박사과정 / Ph.D.
          - name: master
            label: 석사과정 / M.S.
      - name: name
        label: 학생 이름
        type: string
        required: true
      - name: cohort
        label: '기수 (예: 2 또는 2기)'
        type: string
      - name: department
        label: '소속 학과 (예: Dept. Nano Semiconductor Eng.)'
        type: string
      - name: email
        label: 이메일 주소
        type: string
      - name: research
        label: 연구 분야
        type: text
      - name: photo
        label: 학생 사진 업로드
        type: image
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
    - name: alumni
      label: Alumni 졸업생
      type: file
      path: data/alumni.json
      format: json
      list: true
      fields:
      - name: name
        label: 졸업생 이름
        type: string
        required: true
      - name: degree
        label: '졸업 과정 (예: 석사 / 박사)'
        type: string
      - name: graduationYear
        label: '졸업 연도 (예: 2026)'
        type: string
      - name: company
        label: 현 직장 또는 소속
        type: string
      - name: pastResearch
        label: 재학 당시 연구 분야
        type: text
      - name: email
        label: 이메일 (선택사항)
        type: string
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
  - name: cms_publications
    label: Publications · 논문
    type: group
    items:
    - name: publications
      label: 논문 전체 목록 (Wix 포함 · 단일 관리)
      type: file
      path: data/publications.json
      format: json
      list: true
      fields:
      - name: publishedDate
        label: 정확한 출판일 (YYYY-MM-DD, 날짜 기준 자동 정렬)
        type: date
        default: ''
        options:
          format: yyyy-MM-dd
        description: 정확한 날짜가 없으면 비워두고 아래 연도만 입력하세요.
      - name: year
        label: 기존 연도 (날짜를 모르는 기존 논문용, 날짜 입력 시 자동 무시)
        type: number
        description: 정확한 날짜가 있으면 날짜 기준으로 자동 정렬합니다.
      - name: journal
        label: 학술지
        type: string
        required: true
      - name: title
        label: 논문 제목
        type: string
        required: true
      - name: authors
        label: 저자 또는 소개
        type: text
      - name: doi
        label: DOI (https://doi.org/ 제외)
        type: string
      - name: underReview
        label: 현재 상태 — Under Review (심사 중이면 체크)
        type: boolean
        default: false
        description: 체크하면 홈페이지 논문 옆에 Under Review가 표시되고, 상단 Under Review 필터에서도 확인할 수 있습니다. 체크하지 않으면 일반 논문으로 표시합니다. 기존의 Accepted 또는 Under Revision 기록은 데이터에 남지만 더 이상 별도 상태로 표시하지 않습니다.
      - name: typography
        label: 논문 제목 / 저자·설명 글꼴과 크기 (선택)
        description: 논문 제목은 굵고 큰 제목 줄, 저자·설명은 논문 제목 아래의 작은 텍스트입니다. 학술지명(저널)은 공통 디자인으로 표시되며 여기의 글자 크기 설정과 별개입니다.
        type: object
        fields:
        - name: titleFont
          label: 논문 제목 글꼴 — 굵은 논문 제목 줄
          type: select
          options:
            values:
            - name: inherit
              label: 페이지 기본
            - name: pretendard
              label: Pretendard
            - name: noto
              label: Noto Sans KR
            - name: nanum
              label: Nanum Gothic
            - name: serif
              label: Noto Serif KR
        - name: titleSize
          label: 논문 제목 크기(px · 0은 페이지 기본)
          type: number
        - name: bodyFont
          label: 저자·설명 글꼴 — 논문 제목 아래 줄
          type: select
          options:
            values:
            - name: inherit
              label: 페이지 기본
            - name: pretendard
              label: Pretendard
            - name: noto
              label: Noto Sans KR
            - name: nanum
              label: Nanum Gothic
            - name: serif
              label: Noto Serif KR
        - name: bodySize
          label: 저자·설명 글자 크기(px · 0은 페이지 기본)
          type: number
  - name: cms_equipment
    label: Equipment · 장비
    type: group
    items:
    - name: equipment
      label: 연구실 장비
      type: file
      path: data/equipment.json
      format: json
      list: true
      fields:
      - name: name
        label: 장비 이름
        type: string
        required: true
      - name: model
        label: 모델명
        type: string
      - name: photo
        label: 장비 사진
        type: image
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
  - name: cms_news
    label: News · 소식
    type: group
    items:
    - name: news
      label: 공지사항
      type: file
      path: data/news.json
      format: json
      list: true
      fields:
      - name: date
        label: 날짜
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: 구분 (Award, Publication 등)
        type: string
        required: true
      - name: title
        label: 제목
        type: string
        required: true
      - name: description
        label: 내용 요약
        type: text
      - name: detailBody
        label: 펼침 상세 내용 (여러 문단 가능)
        type: text
      - name: detailImage
        label: 상세 내용 사진 (선택)
        type: image
      - name: detailCaption
        label: 상세 사진 설명 (선택)
        type: string
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
  - name: cms_gallery
    label: Gallery · 사진
    type: group
    items:
    - name: gallery
      label: 사진
      type: file
      path: data/gallery.json
      format: json
      list: true
      fields:
      - name: title
        label: 사진 제목
        type: string
        required: true
      - name: date
        label: 날짜 또는 연도
        type: string
      - name: image
        label: 사진 파일 업로드
        type: image
        required: true
      - name: description
        label: 사진 설명
        type: text
      - name: featured
        label: ★ 메인 화면 슬라이드에 표시 (즐겨찾기)
        type: boolean
        default: false
      - name: typography
        label: 선택 항목의 글자 디자인 (제목 / 설명 구분)
        description: 제목은 항목의 이름·헤드라인, 설명/본문은 부가 설명 텍스트입니다. 글자 크기를 0 또는 비워 두면 페이지 기본값입니다.
        type: object
        fields: *id002
  - name: cms_contact
    label: Contact · 연락처
    type: group
