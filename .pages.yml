  - name: professorTitle
    label: 직책 / 소개 첫 번째 줄
    type: text
  - name: professorDepartment
    label: 소속 학과 (두 번째 줄)
    type: text
  - name: professorAdditionalTitle
    label: 추가 직책 (세 번째 줄)
    type: text
  - name: professorUniversity
    label: 소속 대학교 (네 번째 줄)
    type: string
  - name: office
    label: 교수실 위치
    type: string
  - name: professorOfficeLabel
    label: 교수실 표시 문구 (Office)
    type: string
  - name: professorEmail
    label: 이메일 주소
    type: string
  - name: professorEmailLabel
    label: 이메일 표시 문구 (Email)
    type: string
  - name: contactPhone
    label: 교수실 전화번호
    type: string
  - name: professorPhoneLabel
    label: 전화 표시 문구 (Tel)
