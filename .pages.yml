# ACSoL v10 — Page-oriented CMS and safe typography controls
media:
  input: media
  output: /media
  rename: safe
  categories:
  - image
content:
- name: home
  label: Home / 메인 화면 설정
  type: file
  path: data/home.json
  format: json
  fields:
  - name: heroTitle
    label: 메인 큰 문구 (앞부분)
    type: string
  - name: heroAccent
    label: 메인 큰 문구 (블루 컬러·세리프체 강조)
    type: string
  - name: heroKorean
    label: 메인 한국어 연구실명
    type: string
  - name: heroDescription
    label: 메인 영문 소개
    type: text
  - name: labIntro
    label: 메인 연구 분야 요약 설명
    type: text
  - name: slideIntervalSeconds
    label: 메인 사진 자동 전환 간격 (초, 2~60초)
    type: number
  - name: eyebrow
    label: 메인 상단 작은 문구
    type: string
  - name: actionLabel
    label: Explore our research 버튼 문구
    type: string
  - name: summaryLabel
    label: 연구실 소개 라벨
    type: string
  - name: headingFont
    label: 이 페이지 큰 제목 글꼴
    type: select
    options: &id001
      values:
      - name: inherit
        label: 기본 / 공통 설정 상속
      - name: pretendard
        label: Pretendard
      - name: noto
        label: Noto Sans KR
      - name: nanum
        label: Nanum Gothic
      - name: serif
        label: Noto Serif KR
      - name: system
        label: 기본 시스템 글꼴
  - name: headingSize
    label: 이 페이지 큰 제목 글자 크기(px, 0=기본 / 권장 36~92)
    type: number
  - name: bodyFont
    label: 이 페이지 일반 텍스트 글꼴
    type: select
    options: *id001
  - name: bodySize
    label: 이 페이지 본문 크기(px, 0=기본 / 권장 14~20)
    type: number
  - name: labelSize
    label: 이 페이지 작은 라벨·캡션 크기(px, 0=기본)
    type: number
  - name: sectionHeadingSize
    label: 이 페이지 섹션 제목 크기(px, 0=기본)
    type: number
- name: banners
  label: Home / 기간 지정 모집 · 안내 배너
  type: file
  path: data/banners.json
  format: json
  list: true
  fields:
  - name: id
    label: '배너 고유 ID (예: recruit-2027, 중복되지 않게 입력)'
    type: string
    required: true
  - name: enabled
    label: 사용 여부
    type: boolean
    default: true
  - name: title
    label: 배너 제목 (대체 설명 포함)
    type: string
  - name: image
    label: 배너 사진 · JPG/PNG/WebP
    type: image
    required: true
  - name: alt
    label: 사진 대체 설명
    type: string
  - name: startDate
    label: 노출 시작 날짜 (한국시간, 해당 날짜부터)
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: endDate
    label: 노출 마지막 날짜 (한국시간, 해당 날짜까지)
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: linkUrl
    label: 배너 클릭 시 이동할 주소 (선택, https://로 시작)
    type: string
- name: page_research
  label: Research / 페이지 문구 · 글꼴 · 크기
  type: file
  path: data/page-research.json
  format: json
  fields:
  - name: eyebrow
    label: 페이지 상단 작은 문구
    type: string
  - name: titleLead
    label: 페이지 큰 제목 · 앞 문구
    type: string
  - name: titleAccent
    label: 페이지 큰 제목 · 강조 문구
    type: string
  - name: subtitle
    label: 페이지 소개 문구
    type: text
  - name: headingFont
    label: 이 페이지 큰 제목 글꼴
    type: select
    options: *id001
  - name: headingSize
    label: 이 페이지 큰 제목 글자 크기(px, 0=기본 / 권장 36~92)
    type: number
  - name: bodyFont
    label: 이 페이지 일반 텍스트 글꼴
    type: select
    options: *id001
  - name: bodySize
    label: 이 페이지 본문 크기(px, 0=기본 / 권장 14~20)
    type: number
  - name: labelSize
    label: 이 페이지 작은 라벨·캡션 크기(px, 0=기본)
    type: number
  - name: sectionHeadingSize
    label: 이 페이지 섹션 제목 크기(px, 0=기본)
    type: number
- name: research
  label: Research / 연구 분야 · 펼침 상세 내용
  type: file
  path: data/research.json
  format: json
  list: true
  fields:
  - name: title
    label: 연구 분야 제목
    type: string
    required: true
  - name: subtitle
    label: 영문 소제목
    type: string
  - name: description
    label: 연구 분야 상세 설명
    type: text
  - name: keywords
    label: 관련 키워드
    type: text
  - name: image
    label: 연구 분야 사진 업로드
    type: image
  - name: imageAlt
    label: 사진 설명 (접근성)
    type: string
  - name: detailIntro
    label: 펼쳤을 때 나오는 상세 도입 설명
    type: text
  - name: detailSections
    label: 추가 상세 내용 (글·사진 여러 개)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{heading} (블록 {index})'
    fields:
    - name: heading
      label: 상세 항목 제목 (선택)
      type: string
    - name: body
      label: 상세 글 (줄바꿈 가능)
      type: text
    - name: image
      label: 상세 이미지 (선택)
      type: image
    - name: imageAlt
      label: 이미지 대체 설명 (선택)
      type: string
    - name: imageCaption
      label: 이미지 아래 캡션 (선택)
      type: string
    - name: typography
      label: 이 상세 단락만의 글꼴 · 크기 (선택)
      type: object
      fields: &id002
      - name: bodyFont
        label: 본문 글꼴 (선택)
        type: select
        options:
          values:
          - name: inherit
            label: 페이지 기본
          - name: pretendard
            label: Pretendard
          - name: noto
            label: Noto Sans KR
          - name: nanum
            label: Nanum Gothic
          - name: serif
            label: Noto Serif KR
      - name: bodySize
        label: 본문 크기(px, 0=페이지 기본)
        type: number
      - name: titleFont
        label: 제목 글꼴 (선택)
        type: select
        options:
          values:
          - name: inherit
            label: 페이지 기본
          - name: pretendard
            label: Pretendard
          - name: noto
            label: Noto Sans KR
          - name: nanum
            label: Nanum Gothic
          - name: serif
            label: Noto Serif KR
      - name: titleSize
        label: 제목 크기(px, 0=페이지 기본)
        type: number
  - name: typography
    label: 이 항목만의 글꼴 · 글자 크기 (선택)
    type: object
    fields: *id002
